<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>群聊消息</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, sans-serif; margin: 0; display: flex; height: 100vh; background: #f4f6f9; color: #1f2937; }
  .sidebar { width: 240px; background: #fff; border-right: 1px solid #e5e7eb; overflow-y: auto; flex-shrink: 0; }
  .sidebar h2 { font-size: 14px; padding: 14px 16px; margin: 0; border-bottom: 1px solid #e5e7eb; }
  .group { padding: 12px 16px; cursor: pointer; border-bottom: 1px solid #f3f4f6; display: flex; justify-content: space-between; align-items: center; }
  .group:hover { background: #f9fafb; }
  .group.active { background: #eff6ff; border-left: 3px solid #2563eb; }
  .group .name { font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .group .cnt { font-size: 11px; color: #9ca3af; }
  .main { flex: 1; display: flex; flex-direction: column; }
  .header { padding: 14px 20px; background: #fff; border-bottom: 1px solid #e5e7eb; display: flex; align-items: center; gap: 12px; }
  .header h1 { font-size: 16px; margin: 0; }
  .header .meta { font-size: 12px; color: #9ca3af; }
  .msg-list { flex: 1; overflow-y: auto; padding: 16px 20px; }
  .msg { display: flex; gap: 10px; margin-bottom: 12px; align-items: flex-start; }
  .msg .avatar { width: 34px; height: 34px; border-radius: 6px; background: #dbeafe; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #1d4ed8; font-weight: 600; }
  .msg .body { flex: 1; }
  .msg .head { font-size: 12px; color: #6b7280; margin-bottom: 3px; }
  .msg .head b { color: #111827; font-size: 13px; }
  .msg .head .time { margin-left: 8px; color: #9ca3af; }
  .msg .content { font-size: 14px; color: #374151; background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 8px 12px; white-space: pre-wrap; display: inline-block; }
  .msg .tag { font-size: 10px; padding: 1px 6px; border-radius: 8px; margin-left: 6px; }
  .tag-img { background: #fef3c7; color: #92400e; }
  .tag-quote { background: #ede9fe; color: #6d28d9; }
  .tag-mine { background: #def7ec; color: #03543f; }
  .load-more { text-align: center; padding: 16px; }
  .load-more button { padding: 8px 24px; border: 1px solid #d1d5db; background: #fff; border-radius: 8px; cursor: pointer; font-size: 13px; color: #374151; }
  .load-more button:hover { background: #f9fafb; }
  .empty { text-align: center; color: #9ca3af; padding: 60px 0; }
  .msg.has-crop { cursor: pointer; }
  .msg.has-crop:hover { background: #f0f7ff; border-radius: 6px; }
  #crop-pop { position: fixed; display: none; pointer-events: none; z-index: 999;
    border: 1px solid #e5e7eb; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.18);
    background: #fff; padding: 4px; }
  #crop-pop img { display: block; max-width: 300px; max-height: 430px; border-radius: 6px; }
</style>
</head>
<body>
  <div class="sidebar">
    <h2>群聊 / 会话</h2>
    <div id="groups"></div>
  </div>
  <div class="main">
    <div class="header">
      <h1 id="cur-group">选择群聊</h1>
      <span class="meta" id="cur-meta"></span>
    </div>
    <div class="load-more" id="load-more" style="display:none">
      <button onclick="loadMore()">加载更早消息 ↑</button>
    </div>
    <div class="msg-list" id="msg-list">
      <div class="empty">← 左侧选择一个群聊查看消息</div>
    </div>
  </div>
  <div id="crop-pop"><img id="crop-pop-img" alt=""></div>

<script>
let curGroup = null;
let page = 1;
const PAGE_SIZE = 30;
let lastMaxTs = null;   // 当前最新消息时间戳，用于检测新消息

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtTime(ts) {
  if (!ts) return '';
  const d = new Date(ts * 1000);
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  const hm = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  return sameDay ? hm : `${d.getMonth()+1}/${d.getDate()} ${hm}`;
}
function firstChar(s) { return (s || '?').trim().charAt(0); }

async function loadGroups() {
  const r = await fetch('/api/messages/groups');
  const d = await r.json();
  const el = document.getElementById('groups');
  el.innerHTML = '';
  for (const g of d.groups) {
    const div = document.createElement('div');
    div.className = 'group' + (g.name === curGroup ? ' active' : '');
    div.innerHTML = `<span class="name">${esc(g.name)}</span><span class="cnt">${g.cnt}</span>`;
    div.onclick = () => selectGroup(g.name);
    el.appendChild(div);
  }
}

async function selectGroup(name) {
  curGroup = name;
  page = 1;
  document.getElementById('cur-group').textContent = name;
  document.getElementById('msg-list').innerHTML = '<div class="empty">加载中…</div>';
  await loadMessages(true);
  await loadGroups();  // 刷新高亮
}

async function loadMessages(reset) {
  if (!curGroup) return;
  if (reset) { page = 1; }
  const r = await fetch(`/api/messages/list?group=${encodeURIComponent(curGroup)}&page=${page}&page_size=${PAGE_SIZE}`);
  const d = await r.json();
  document.getElementById('cur-meta').textContent = `共 ${d.total} 条消息`;
  if (reset) {
    document.getElementById('msg-list').innerHTML = '';
    lastMaxTs = d.messages.length ? d.messages[0].ts_captured : null;
  }
  if (!d.messages.length && reset) {
    document.getElementById('msg-list').innerHTML = '<div class="empty">暂无消息</div>';
  } else if (d.messages.length) {
    // 最新在底：初始把最新一页反转成「旧→新」追加到底部；
    // 「加载更早」把更早一页插到顶部。
    renderMessages(d.messages, reset ? 'bottom' : 'top');
  }
  if (reset) {
    const list = document.getElementById('msg-list');
    list.scrollTop = list.scrollHeight;   // 滚到底部，让最新消息可见
  }
  document.getElementById('load-more').style.display = d.has_more ? '' : 'none';
  page++;
}

function buildMsg(m) {
  const div = document.createElement('div');
  div.className = 'msg' + (m.crop_path ? ' has-crop' : '');
  if (m.crop_path) div.dataset.crop = '/workspace/' + m.crop_path;
  const tag = m.content_type === 'image' || m.content_type === 'multimedia' ? '<span class="tag tag-img">多媒体</span>'
            : m.content_type === 'quote' ? '<span class="tag tag-quote">引用</span>'
            : m.is_mine ? '<span class="tag tag-mine">我</span>' : '';
  const ts = m.ts_hint || m.ts_captured;
  div.innerHTML = `<div class="avatar">${esc(firstChar(m.sender))}</div>
    <div class="body">
      <div class="head"><b>${esc(m.sender)}</b>${tag}<span class="time">${fmtTime(ts)}</span></div>
      <div class="content">${esc(m.content) || '[多媒体消息]'}</div>
    </div>`;
  return div;
}

function renderMessages(messages, position) {
  // messages：API 返回（最新在前）；position='bottom' 追加到底部，'top' 插到顶部（更早）。
  // 统一反转成「旧→新」，保证时间顺序自上而下；「最新在底」= 最新那条排最后。
  const list = document.getElementById('msg-list');
  const frag = document.createDocumentFragment();
  for (const m of [...messages].reverse()) {
    frag.appendChild(buildMsg(m));
  }
  if (position === 'top') list.prepend(frag); else list.appendChild(frag);
}

async function loadMore() {
  await loadMessages(false);
}

// 实时更新：每 4 秒拉最新一页，检测是否有新消息
async function pollNew() {
  if (!curGroup) return;
  try {
    const r = await fetch(`/api/messages/list?group=${encodeURIComponent(curGroup)}&page=1&page_size=10`);
    const d = await r.json();
    if (d.messages.length && d.messages[0].ts_captured !== lastMaxTs) {
      // 有新消息：追加到底部（最新在底）
      const newOnes = [];
      for (const m of d.messages) {
        if (m.ts_captured === lastMaxTs) break;
        newOnes.push(m);
      }
      if (newOnes.length) {
        renderMessages(newOnes, 'bottom');   // 新消息追加到底部（最新在底）
        const list = document.getElementById('msg-list');
        list.scrollTop = list.scrollHeight;
      }
      lastMaxTs = d.messages[0].ts_captured;
      document.getElementById('cur-meta').textContent = `共 ${d.total} 条消息`;
    }
  } catch (e) {}
}

loadGroups();
setInterval(pollNew, 4000);

// 悬停显示本条消息在实时采集时裁下的截图（跟随鼠标，带边距防遮挡）
document.addEventListener('mousemove', (ev) => {
  const pop = document.getElementById('crop-pop');
  const target = ev.target.closest ? ev.target.closest('.msg.has-crop') : null;
  if (target) {
    const src = target.dataset.crop;
    const img = document.getElementById('crop-pop-img');
    if (img.dataset.src !== src) { img.src = src; img.dataset.src = src; }
    pop.style.display = 'block';
    let x = ev.clientX + 16, y = ev.clientY + 12;
    if (x + 300 > window.innerWidth) x = ev.clientX - 316;
    if (y + 430 > window.innerHeight) y = window.innerHeight - 440;
    pop.style.left = x + 'px';
    pop.style.top = y + 'px';
  } else {
    pop.style.display = 'none';
  }
});
</script>
</body>
</html>
